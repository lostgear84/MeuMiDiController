org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Java 17 que vem com Android Studio
org.gradle.java.home=/usr/lib/jvm/java-25-openjdk-amd64

# Evita o JdkImageTransform/jlink que está falhando no seu ambiente Windows
android.disableJdkImageTransform=true

# Desativar lint completamente
android.disableLint=true
android.lint.disableLintTasks=true