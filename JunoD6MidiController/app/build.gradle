plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.junod6midicontroller'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.junod6midicontroller"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        disable 'All'
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    tasks.whenTaskAdded { task ->
        if (task.name == 'lintVitalAnalyzeRelease' || task.name == 'lintAnalyzeDebug') {
            task.enabled = false
        }
    }
}

dependencies {
}